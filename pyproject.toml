[project]
name = "researchpilot"
version = "0.1.0"
description = "Autonomous research agent built with LangGraph, Gemini and ChromaDB"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
# 3.12 because the dependency stubs (numpy) use 3.12 syntax. The code itself
# still runs on 3.11 - that is what the ruff target-version enforces.
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]