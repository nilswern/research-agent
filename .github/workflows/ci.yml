name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Settings verlangt den Key; in der CI reicht ein Platzhalter, weil kein
      # Test das LLM aufruft. Einen echten Key nie hier, sondern als Secret.
      GOOGLE_API_KEY: ci-dummy-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # torch zuerst aus dem CPU-Index: sonst zieht sentence-transformers die
        # CUDA-Variante (mehrere GB) auf einen Runner ohne GPU.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest
