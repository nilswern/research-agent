name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Settings requires the key; a placeholder is enough in CI because no
      # test calls the LLM. A real key never goes here - use a secret.
      GOOGLE_API_KEY: ci-dummy-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # torch from the CPU index first: otherwise sentence-transformers pulls
        # the CUDA build (several GB) onto a runner without a GPU.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests evals

      - name: Format
        run: ruff format --check src tests evals

      - name: Types
        run: mypy src evals

      - name: Tests
        run: pytest
